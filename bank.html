
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLOWX | BANK TRANSFER</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:30px 16px;min-height:100vh;
  display:flex;justify-content:center;align-items:center;
  font-family:Arial,sans-serif;color:#fff;
  background:linear-gradient(145deg,#100d20,#24183b,#11101b);
}
.card{
  width:100%;max-width:420px;padding:30px 22px;
  text-align:center;border:1px solid #57416e;
  border-radius:24px;background:#1c1830;
  box-shadow:0 15px 50px #0008;
}
.logo{font-size:34px;font-weight:900;letter-spacing:3px}
.logo span{color:#e65b39}
.tag{color:#e6c8fa;letter-spacing:2px;font-size:13px;margin-top:6px}
h2{font-size:22px;margin:28px 0 8px}
.sub{color:#c9bfd8;font-size:14px}
.bank{
  margin:24px 0;padding:22px 15px;
  border-radius:16px;background:#292341;border:1px solid #514366;
}
.bankname{font-size:14px;color:#e6c8fa}
.number{font-size:27px;font-weight:bold;letter-spacing:1px;margin:15px 0}
.owner{font-size:14px;color:#d8cde5}
button{
  border:0;border-radius:30px;padding:13px 24px;
  background:#e65b39;color:white;font-weight:bold;
  font-size:15px;cursor:pointer;
}
.note{font-size:13px;color:#f5d5a8;line-height:1.8;margin-top:22px}
.footer{font-size:11px;color:#9e91b0;margin-top:24px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">FLOW<span>X</span></div>
  <div class="tag">GAMING CENTER</div>
  <h2>BANK TRANSFER</h2>
  <div class="sub">ช่องทางโอนเงินผ่านธนาคาร</div>
  <div class="bank">
    <div class="bankname">ธนาคารกสิกรไทย | KBANK</div>
    <div class="number">241-1-80708-0</div>
    <div class="owner">นายทศพล ปวงแก้ว</div>
  </div>
  <button onclick="navigator.clipboard.writeText('2411807080').then(()=>alert('คัดลอกเลขบัญชีแล้วค่ะ 💗')).catch(()=>alert('ไม่สามารถคัดลอกได้ กรุณาคัดลอกเลขบัญชีด้วยตนเอง'))">
    COPY ACCOUNT NUMBER
  </button>
  <div class="note">
    ♡ กรุณาตรวจสอบชื่อบัญชีก่อนโอน ♡<br>
    โอนเรียบร้อยแล้ว ส่งสลิปให้แอดมินด้วยน้า
  </div>
  <div class="footer">FLOWX — POWER UP YOUR PLAY</div>
</div>
</body>
</html>
