
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLOWX | QR PAYMENT</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:30px 16px;min-height:100vh;
  display:flex;justify-content:center;align-items:center;
  font-family:Arial,sans-serif;color:#fff;
  background:linear-gradient(145deg,#100d20,#24183b,#11101b);
}
.card{
  width:100%;max-width:420px;padding:28px 22px;
  text-align:center;border:1px solid #57416e;
  border-radius:24px;background:#1c1830;
  box-shadow:0 15px 50px #0008;
}
.logo{font-size:34px;font-weight:900;letter-spacing:3px}
.logo span{color:#e65b39}
.tag{color:#e6c8fa;letter-spacing:2px;font-size:13px;margin-top:6px}
h2{font-size:22px;margin:28px 0 8px}
.sub{color:#c9bfd8;font-size:14px}
.qr{
  background:white;border-radius:16px;padding:12px;
  margin:22px auto;max-width:280px;
}
.qr img{display:block;width:100%;height:auto}
.note{font-size:13px;color:#f5d5a8;line-height:1.7}
.footer{font-size:11px;color:#9e91b0;margin-top:24px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">FLOW<span>X</span></div>
  <div class="tag">GAMING CENTER</div>
  <h2>QR PAYMENT</h2>
  <div class="sub">สแกน QR Code เพื่อชำระเงิน</div>
  <div class="qr">
    <img src="payment-qr.png" alt="FLOWX Payment QR">
  </div>
  <div class="note">
    ♡ กรุณาตรวจสอบยอดเงินก่อนโอน ♡<br>
    โอนเรียบร้อยแล้ว ส่งสลิปให้แอดมินด้วยน้า
  </div>
  <div class="footer">FLOWX — POWER UP YOUR PLAY</div>
</div>
</body>
</html>
